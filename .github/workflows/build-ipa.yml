name: Build iPad IPA

# Unsigned iPad build on a STANDARD free runner only (macos-26).
# The Xcode project now exists: Apps/iPad/CascadeConsole.xcodeproj,
# scheme "CascadeConsole" (shared scheme in xcshareddata), target
# CascadeConsole, bundle id com.user.cascadeconsole, iPad only,
# deployment target iOS 17.0. It builds against the Swift StubEngine
# in Shared/Engine — the native OCCT Layer-2 library does not exist
# yet (see the TODO header in project.pbxproj), so a green run means
# "the app compiles and packages", NOT "CAD commands work on device".
# Any build failure fails this job — nothing here masks errors
# (no continue-on-error, no `|| true`).

on:
  workflow_dispatch:
  push:

jobs:
  build:
    name: Cascade Console unsigned IPA
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Verify project and scheme exist
        run: |
          test -f Apps/iPad/CascadeConsole.xcodeproj/project.pbxproj
          test -f Apps/iPad/CascadeConsole.xcodeproj/xcshareddata/xcschemes/CascadeConsole.xcscheme
          test -f Shared/Resources/catalog.json
          xcodebuild -list -project Apps/iPad/CascadeConsole.xcodeproj
      - name: Build CascadeConsole (unsigned)
        run: |
          xcodebuild build \
            -project Apps/iPad/CascadeConsole.xcodeproj \
            -scheme CascadeConsole \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
      - name: Verify the app bundle carries its resources
        run: |
          APP_PATH="build/dd/Build/Products/Release-iphoneos/CascadeConsole.app"
          test -d "$APP_PATH"
          test -f "$APP_PATH/catalog.json"
          test -f "$APP_PATH/default.metallib"
          test -f "$APP_PATH/OCCT-LGPL-2.1.txt"
      - name: Package IPA
        run: |
          APP_PATH="build/dd/Build/Products/Release-iphoneos/CascadeConsole.app"
          rm -rf Payload CascadeConsole-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry CascadeConsole-unsigned.ipa Payload
          ls -lh CascadeConsole-unsigned.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CascadeConsole-unsigned-ipa
          path: CascadeConsole-unsigned.ipa
