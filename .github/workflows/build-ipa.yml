name: Build iPad IPA

# Unsigned iPad build on a STANDARD free runner only (macos-26).
#
# v0.2 — NATIVE ENGINE LINKED. Steps:
#   1. Fetch a-user-of-python/cascade-ios at the pinned commit below
#      (the cascade-port OCCT 8.0.1 subset + mc_* facade = CascadeKit).
#      CI fetch, NOT vendoring/submodule — see docs/ENGINE-REPORT.md §4.
#   2. Inject mc_clone_shape + mc_export_stl into the CHECKOUT's facade
#      (Core/native/ci/patch_cascade_port.py; cascade-ios itself and
#      all OCCT sources stay unmodified — LGPL).
#   3. Build CascadeKit (libCascadeKit.a) from that checkout.
#   4. Compile the Layer-2 interpreter (Core/native/src/cc_interpreter
#      .cpp + ccgeom_mc.cpp) into libCascadeConsoleEngine.a.
#   5. Build the app with CASCADE_NATIVE_ENGINE defined, the
#      CCascadeConsole module map on SWIFT_INCLUDE_PATHS, and both
#      libraries on the link line — EngineFactory.makeEngine() then
#      returns NativeEngine in the shipped binary.
#   6. GATE: the shipped executable must contain the native symbols
#      (cc_execute / cc_session_create / mc_clone_shape) and the bundle
#      must carry catalog.json, default.metallib and BOTH OCCT licence
#      texts. A build that silently fell back to the stub fails here.
# Any failure fails this job — nothing masks errors.

on:
  workflow_dispatch:
  push:

env:
  CASCADE_IOS_SHA: 061875afb5384227db5f39cba81266cf889257a4

jobs:
  build:
    name: Cascade Console unsigned IPA (native engine)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Fetch cascade-port (CascadeKit) at pinned commit
        uses: actions/checkout@v4
        with:
          repository: a-user-of-python/cascade-ios
          ref: ${{ env.CASCADE_IOS_SHA }}
          path: cascade-port-src

      - name: Inject mc_additions into the cascade-port checkout
        run: python3 Core/native/ci/patch_cascade_port.py cascade-port-src

      - name: Verify project and scheme exist
        run: |
          test -f Apps/iPad/CascadeConsole.xcodeproj/project.pbxproj
          test -f Apps/iPad/CascadeConsole.xcodeproj/xcshareddata/xcschemes/CascadeConsole.xcscheme
          test -f Shared/Resources/catalog.json
          xcodebuild -list -project Apps/iPad/CascadeConsole.xcodeproj

      - name: Restore cached CascadeKit library
        id: kitcache
        uses: actions/cache@v4
        with:
          path: build/kitlib
          key: cascadekit-${{ env.CASCADE_IOS_SHA }}-${{ hashFiles('Core/native/ci/patch_cascade_port.py') }}-v1

      - name: Build CascadeKit library (OCCT + mc_* facade, direct clang)
        if: steps.kitcache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          # xcodebuild over the generated 5,234-file project never
          # finished in CI; this compiles the same sources directly
          # with parallel clang using the exact settings
          # gen_project.py encodes (defines + header dirs + gnu++17).
          # (Chunked-unity compilation was tried and reverted: OCCT
          # file-scope helpers collide across files in a toolkit.)
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          cd "$GITHUB_WORKSPACE/cascade-port-src"
          mkdir -p "$GITHUB_WORKSPACE/build/kitobj" "$GITHUB_WORKSPACE/build/kitlib"
          INC="-IFacade -IOCCT/generated"
          while IFS= read -r d; do INC="$INC -I$d"; done < <(find OCCT/src -type d | sort)
          find OCCT/src -name '*.cxx' -o -name '*.cpp' -o -name '*.c' > "$GITHUB_WORKSPACE/build/kitobj/sources.txt"
          echo "Facade/occt_facade.cpp" >> "$GITHUB_WORKSPACE/build/kitobj/sources.txt"
          wc -l "$GITHUB_WORKSPACE/build/kitobj/sources.txt"
          export SDK INC GITHUB_WORKSPACE
          compile_one() {
            src="$1"
            obj="$GITHUB_WORKSPACE/build/kitobj/$(printf '%s' "$src" | md5 -q).o"
            case "$src" in
              *.c) clang -target arm64-apple-ios17.0 -isysroot "$SDK" -O1 -w \
                     -DOCC_CONVERT_SIGNALS -DNo_Exception -DOCCT_NO_PLUGINS -DNDEBUG \
                     $INC -c "$src" -o "$obj" ;;
              *)   clang++ -std=gnu++17 -target arm64-apple-ios17.0 -isysroot "$SDK" -O1 -w \
                     -DOCC_CONVERT_SIGNALS -DNo_Exception -DOCCT_NO_PLUGINS -DNDEBUG \
                     $INC -c "$src" -o "$obj" ;;
            esac
          }
          export -f compile_one
          xargs -P "$(sysctl -n hw.ncpu)" -I SRC bash -c 'compile_one "$@"' _ SRC \
            < "$GITHUB_WORKSPACE/build/kitobj/sources.txt"
          ar rcs "$GITHUB_WORKSPACE/build/kitlib/libCascadeKit.a" "$GITHUB_WORKSPACE/build/kitobj"/*.o
          ls -la "$GITHUB_WORKSPACE/build/kitlib/"

      - name: Build Layer-2 engine library (cc_interpreter + ccgeom_mc)
        run: |
          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p build
          for src in cc_interpreter ccgeom_mc ccsim ccsim_commands ccsim_backend_mc; do
            clang++ -std=c++17 -O2 \
              -target arm64-apple-ios17.0 \
              -isysroot "$SDK_PATH" \
              -ICore/native/include -ICore/native/src \
              -Icascade-port-src/Facade \
              -c "Core/native/src/$src.cpp" -o "build/$src.o"
          done
          ar rcs build/libCascadeConsoleEngine.a build/cc_interpreter.o build/ccgeom_mc.o
          echo "Layer-2 symbols in libCascadeConsoleEngine.a:"
          nm build/libCascadeConsoleEngine.a | grep -E "cc_execute|mc_clone_shape" || true

      - name: Write CCascadeConsole module map
        run: |
          mkdir -p build/ccmodule
          cat > build/ccmodule/module.modulemap <<EOF
          module CCascadeConsole {
              header "$GITHUB_WORKSPACE/Core/native/include/cc_facade.h"
              export *
          }
          EOF
          cat build/ccmodule/module.modulemap

      - name: Build CascadeConsole (unsigned, native engine)
        run: |
          xcodebuild build \
            -project Apps/iPad/CascadeConsole.xcodeproj \
            -scheme CascadeConsole \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS=CASCADE_NATIVE_ENGINE \
            SWIFT_INCLUDE_PATHS="$GITHUB_WORKSPACE/build/ccmodule" \
            HEADER_SEARCH_PATHS='$(inherited) '"$GITHUB_WORKSPACE/Core/native/include" \
            OTHER_LDFLAGS='$(inherited) -L'"$GITHUB_WORKSPACE/build/kitlib"' -L'"$GITHUB_WORKSPACE/build"' -lCascadeKit -lCascadeConsoleEngine -lc++'

      - name: Gate — bundle resources AND native engine in the binary
        run: |
          APP_PATH="build/dd/Build/Products/Release-iphoneos/CascadeConsole.app"
          test -d "$APP_PATH"
          test -f "$APP_PATH/catalog.json"
          test -f "$APP_PATH/default.metallib"
          test -f "$APP_PATH/OCCT-LGPL-2.1.txt"
          test -f "$APP_PATH/OCCT-LGPL-EXCEPTION.txt"
          BIN="$APP_PATH/CascadeConsole"
          echo "Native-engine symbols in the shipped executable:"
          xcrun nm "$BIN" | grep -E "_cc_execute$|_cc_session_create$|_mc_clone_shape$|_mc_export_stl$"
          xcrun nm "$BIN" | grep -qE " _cc_execute$"
          xcrun nm "$BIN" | grep -qE " _cc_session_create$"
          xcrun nm "$BIN" | grep -qE " _mc_clone_shape$"
          echo "GATE PASS: native engine is linked into the shipped binary"

      - name: Package IPA
        run: |
          APP_PATH="build/dd/Build/Products/Release-iphoneos/CascadeConsole.app"
          rm -rf Payload CascadeConsole-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry CascadeConsole-unsigned.ipa Payload
          ls -lh CascadeConsole-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CascadeConsole-unsigned-ipa
          path: CascadeConsole-unsigned.ipa
